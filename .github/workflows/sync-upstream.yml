name: Sync from Upstream

on:
  schedule:
    - cron: '0 3 * * *'  # каждый день в 3:00 UTC
  workflow_dispatch:     # можно запустить вручную

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/langflow-ai/langflow.git
          git fetch upstream

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge upstream with strategy to avoid workflow updates
        run: |
          git checkout main

          # Создаём временную ветку
          git checkout -b temp-merge
          git merge upstream/main

          # Удаляем workflow-файлы, если они конфликтуют с политикой
          if [ -d ".github/workflows" ]; then
            git checkout HEAD -- .github/workflows/
            echo "Restored your own workflows to avoid permission error."
          fi

          # Переключаемся обратно и перезаписываем main
          git checkout main
          git reset --hard temp-merge
          git push origin main

          # Очистка
          git branch -D temp-merge
