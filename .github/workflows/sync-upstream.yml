name: Sync from Upstream

on:
  schedule:
    - cron: '0 3 * * *'  # каждый день в 3:00 UTC
  workflow_dispatch:     # можно запустить вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/langflow-ai/langflow.git
          git fetch upstream

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge upstream but exclude workflow files
        run: |
          git checkout main

          # Merge без автоматического коммита
          git merge --no-commit --no-ff upstream/main

          # Удаляем ВСЕ workflow-файлы, даже новые
          rm -rf .github/workflows/

          # Восстанавливаем ТОЛЬКО СВОИ workflow-файлы (если они есть в репо)
          # Например, только sync-upstream.yml
          mkdir -p .github/workflows
          curl -s -o .github/workflows/sync-upstream.yml \
            https://raw.githubusercontent.com/scorn12345/langflow-mirror/main/.github/workflows/sync-upstream.yml

          # Если были другие — добавь их аналогично

          # Коммитим ТОЛЬКО безопасные изменения
          git add .
          git commit -m "chore: sync from upstream (workflows excluded)" || echo "No changes to commit"

          git push origin main
