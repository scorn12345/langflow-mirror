name: Sync from Upstream

on:
  schedule:
    - cron: '0 3 * * *'  # каждый день в 3:00 UTC
  workflow_dispatch:     # можно запустить вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/langflow-ai/langflow.git
          git fetch upstream

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge upstream but exclude workflow files
        run: |
          git checkout main

          # Merge без автоматического коммита
          git merge --no-commit --no-ff upstream/main

          # Явно удаляем ВСЕ workflow-файлы через git (чтобы Git знал об удалении)
          if [ -d ".github/workflows" ]; then
            git rm -rf .github/workflows/ 2>/dev/null || true
          fi

          # Создаём заново папку и добавляем ТОЛЬКО нужный workflow
          mkdir -p .github/workflows
          curl -s -o .github/workflows/sync-upstream.yml \
          https://raw.githubusercontent.com/scorn12345/langflow-mirror/main/.github/workflows/sync-upstream.yml

          # Добавляем изменения в индекс
          git add .github/workflows/

          # Коммитим только если есть изменения
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync from upstream (workflows excluded)"
            git push origin main
          else
            echo "No changes to commit"
          fi
